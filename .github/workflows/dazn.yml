name: DAZN M3U Auto Generator

on:
  schedule:
    - cron: '*/15 9-21 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pywidevine bs4 pyjwt colorama curl_cffi requests lxml

      # ============================================================
      # TENTATIVO DI CONNESSIONE A TAILSCALE CON TIMEOUT (45s)
      # ============================================================
      - name: Connect to Tailscale (timeout 45s)
        id: tailscale_connect
        run: |
          echo "=== Connessione a Tailscale (timeout 45s) ==="
          if timeout 45s tailscale up \
            --authkey=${{ secrets.TAILSCALE_AUTHKEY }} \
            --exit-node=${{ secrets.TAILSCALE_EXIT_NODE_IP }} \
            --exit-node-allow-lan-access; then
            echo "✅ Connessione Tailscale completata."
            echo "connected=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Connessione Tailscale fallita o timeout (PC spento o irraggiungibile)."
            echo "connected=false" >> $GITHUB_OUTPUT
          fi

      # ============================================================
      # SE LA CONNESSIONE È FALLITA, TERMINA IL WORKFLOW
      # ============================================================
      - name: Exit if Tailscale not connected
        if: steps.tailscale_connect.outputs.connected == 'false'
        run: |
          echo "⏭️ Workflow terminato (PC non raggiungibile)."
          exit 0
      # ============================================================

      # ============================================================
      # VERIFICA ULTERIORE: tailscale status
      # ============================================================
      - name: Verify Tailscale status
        run: |
          if ! tailscale status; then
            echo "❌ Tailscale non è attivo (status fallito). Termino."
            exit 0
          fi
          echo "✅ Tailscale attivo."
      # ============================================================

      - name: Download accountsdazn.json from Gist
        run: |
          curl -s -o accountsdazn.json "${{ secrets.ACCOUNTS_GIST_URL }}"
          sed -i '1s/^\xEF\xBB\xBF//' accountsdazn.json
          sed -i 's/\r$//' accountsdazn.json

      - name: Download script from Gist
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          curl -s "https://gist.githubusercontent.com/raw/${GIST_ID}/dazn.py" -o dazn.py

      - name: Run DAZN Script
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          python -u dazn.py

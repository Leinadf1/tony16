name: DAZN M3U Auto Generator

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pywidevine bs4 pyjwt colorama curl_cffi requests lxml

      - name: Download accountsdazn.json from Gist
        run: |
          curl -s -o accountsdazn.json "${{ secrets.ACCOUNTS_GIST_URL }}"
          sed -i '1s/^\xEF\xBB\xBF//' accountsdazn.json
          sed -i 's/\r$//' accountsdazn.json

      - name: Download scripts from Gist
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          curl -s "https://gist.githubusercontent.com/raw/${GIST_ID}/dazn.py" -o dazn.py
          curl -s "https://gist.githubusercontent.com/raw/${GIST_ID}/dazn_events.py" -o dazn_events.py

      - name: Install and connect Cloudflare WARP
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp
          sudo warp-cli registration new --accept-tos
          sudo warp-cli set-mode warp+doh
          sudo warp-cli connect
          sleep 5
          echo "IP pubblico dopo Warp:"
          curl -s https://ifconfig.me
          echo ""
          warp-cli status

      - name: Run DAZN 1 Script (WARP)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          DUPLICATE_DAZN1_AS_WARP: "true"
        run: python -u dazn.py

name: DAZN M3U Auto Generator

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pywidevine bs4 pyjwt colorama curl_cffi requests lxml

      # ============================================================
      # CONTROLLO RAPIDO: PC RAGGIUNGIBILE? (PING)
      # ============================================================
      - name: Check if exit node is reachable
        id: ping_check
        run: |
          if ping -c 1 -W 2 ${{ secrets.TAILSCALE_EXIT_NODE_IP }} > /dev/null 2>&1; then
            echo "✅ PC raggiungibile."
            echo "reachable=true" >> $GITHUB_OUTPUT
          else
            echo "❌ PC non raggiungibile (spento o offline)."
            echo "reachable=false" >> $GITHUB_OUTPUT
          fi

      - name: Exit if node not reachable
        if: steps.ping_check.outputs.reachable == 'false'
        run: |
          echo "⏭️ Workflow terminato (PC spento)."
          exit 0
      # ============================================================

      # ============================================================
      # INSTALLA TAILSCALE (solo se PC raggiungibile)
      # ============================================================
      - name: Install Tailscale
        if: steps.ping_check.outputs.reachable == 'true'
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          echo "✅ Tailscale installato."

      # ============================================================
      # CONNESSIONE A TAILSCALE CON TIMEOUT (30 secondi)
      # ============================================================
      - name: Connect to Tailscale (timeout 30s)
        id: tailscale_connect
        if: steps.ping_check.outputs.reachable == 'true'
        continue-on-error: false
        run: |
          echo "=== Connessione a Tailscale (timeout 30s) ==="
          if timeout 30s sudo tailscale up \
            --authkey=${{ secrets.TAILSCALE_AUTHKEY }} \
            --exit-node=${{ secrets.TAILSCALE_EXIT_NODE_IP }} \
            --exit-node-allow-lan-access; then
            echo "✅ Connessione Tailscale completata."
            echo "connected=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Connessione Tailscale fallita (timeout o errore)."
            echo "connected=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      # ============================================================
      # VERIFICA STATO WARP (solo se connessi)
      # ============================================================
      - name: Check Warp status
        id: check_warp
        if: steps.tailscale_connect.outputs.connected == 'true'
        run: |
          echo "=== Verifica stato Warp ==="
          WARP_STATUS=$(curl -s --max-time 10 https://www.cloudflare.com/cdn-cgi/trace | grep -i "^warp=" | cut -d'=' -f2 | tr -d '[:space:]')
          if [ "$WARP_STATUS" == "on" ]; then
            echo "✅ Warp attivo."
            echo "warp_active=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Warp non attivo."
            echo "warp_active=false" >> $GITHUB_OUTPUT
          fi

      # ============================================================
      # DOWNLOAD DEI FILE DAL GIST
      # ============================================================
      - name: Download accountsdazn.json from Gist
        if: steps.tailscale_connect.outputs.connected == 'true'
        run: |
          curl -s -o accountsdazn.json "${{ secrets.ACCOUNTS_GIST_URL }}"
          sed -i '1s/^\xEF\xBB\xBF//' accountsdazn.json
          sed -i 's/\r$//' accountsdazn.json

      - name: Download scripts from Gist
        if: steps.tailscale_connect.outputs.connected == 'true'
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          curl -s "https://gist.githubusercontent.com/raw/${GIST_ID}/dazn.py" -o dazn.py
          curl -s "https://gist.githubusercontent.com/raw/${GIST_ID}/dazn_events.py" -o dazn_events.py

      # ============================================================
      # 1. SCRIPT DAZN 1 (sempre eseguito se PC acceso)
      # ============================================================
      - name: Run DAZN 1 Script
        if: steps.tailscale_connect.outputs.connected == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          DUPLICATE_DAZN1_AS_WARP: ${{ steps.check_warp.outputs.warp_active }}
        run: |
          echo "=== Esecuzione DAZN 1 ==="
          python -u dazn.py

      # ============================================================
      # 2. SCRIPT EVENTI (solo se Warp attivo)
      # ============================================================
      - name: Run DAZN Events Script
        if: steps.tailscale_connect.outputs.connected == 'true' && steps.check_warp.outputs.warp_active == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          echo "=== Esecuzione DAZN Events (Warp attivo) ==="
          python -u dazn_events.py

name: DAZN M3U Auto Generator

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pywidevine bs4 pyjwt colorama curl_cffi requests lxml

      # ============================================================
      # INSTALLA TAILSCALE PRIMA DI QUALSIASI PING
      # ============================================================
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          echo "✅ Tailscale installato."

      # ============================================================
      # PROVA A CONNETTERE TAILSCALE CON TIMEOUT 30s
      # ============================================================
      - name: Connect to Tailscale (timeout 30s)
        id: tailscale_connect
        continue-on-error: false
        run: |
          echo "=== Connessione a Tailscale (timeout 30s) ==="
          if timeout 30s sudo tailscale up \
            --authkey=${{ secrets.TAILSCALE_AUTHKEY }} \
            --exit-node=${{ secrets.TAILSCALE_EXIT_NODE_IP }} \
            --exit-node-allow-lan-access; then
            echo "✅ Connessione Tailscale completata."
            echo "connected=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Connessione Tailscale fallita (timeout o errore)."
            echo "connected=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      # ============================================================
      # VERIFICA CHE IL PC SIA RAGGIUNGIBILE (DOPO LA CONNESSIONE)
      # ============================================================
      - name: Check if exit node is reachable via Tailscale
        if: steps.tailscale_connect.outputs.connected == 'true'
        run: |
          echo "=== Verifica raggiungibilità PC via Tailscale ==="
          # Usa tailscale ping per verificare (2 secondi di timeout)
          if tailscale ping --timeout=2s ${{ secrets.TAILSCALE_EXIT_NODE_IP }}; then
            echo "✅ PC raggiungibile via Tailscale."
            echo "reachable=true" >> $GITHUB_OUTPUT
          else
            echo "❌ PC non raggiungibile (spento o offline)."
            echo "reachable=false" >> $GITHUB_OUTPUT
            exit 1   # Termina il workflow se non raggiungibile
          fi
      # ============================================================

      # ============================================================
      # SE RAGGIUNGIBILE, PROSEGUI
      # ============================================================
      - name: Check Warp status
        id: check_warp
        if: steps.tailscale_connect.outputs.connected == 'true'
        run: |
          echo "=== Verifica stato Warp ==="
          WARP_STATUS=$(curl -s --max-time 10 https://www.cloudflare.com/cdn-cgi/trace | grep -i "^warp=" | cut -d'=' -f2 | tr -d '[:space:]')
          if [ "$WARP_STATUS" == "on" ]; then
            echo "✅ Warp attivo."
            echo "warp_active=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Warp non attivo."
            echo "warp_active=false" >> $GITHUB_OUTPUT
          fi

      # ... (resto del workflow come prima, con download e script) ...

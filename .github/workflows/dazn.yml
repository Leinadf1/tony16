name: DAZN M3U Auto Generator

on:
  schedule:
    # Esegue ogni 16 minuti
    - cron: '*/16 * * * *'
  workflow_dispatch: # Permette l'avvio manuale

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pywidevine bs4 pyjwt colorama curl_cffi requests

      # (Opzionale) Inserisci qui lo step Tailscale se usi il tuo nodo di casa
      # - name: Connect to Tailscale
      #   uses: tailscale/github-action@v2
      #   ...

      - name: Download script from Gist
        run: |
          # Sostituisci il link qui sotto con il tuo URL RAW del Gist
          curl -s https://gist.githubusercontent.com/tuo-utente/IL_TUO_GIST_ID/raw/dazn.py -o dazn.py

      - name: Run DAZN Script
        env:
          DAZN_USER: ${{ secrets.DAZN_USER }}
          DAZN_PASS: ${{ secrets.DAZN_PASS }}
          WVD_BASE64: ${{ secrets.WVD_BASE64 }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python dazn.py

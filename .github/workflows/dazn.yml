name: DAZN M3U Auto Generator

on:
  schedule:
    - cron: '*/16 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pywidevine bs4 pyjwt colorama curl_cffi requests

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --exit-node=${{ secrets.TAILSCALE_EXIT_NODE_IP }} --exit-node-allow-lan-access
          # Accetta DNS dal nodo di uscita (default true)

      - name: Force DNS resolution via DoH and update /etc/hosts
        run: |
          # Ottieni IP via Cloudflare DoH (usa jq per estrarre l'IP)
          IP_PLAYBACK=$(curl -s "https://cloudflare-dns.com/dns-query?name=playback.dazn.com&type=A" -H "accept: application/dns-json" | jq -r '.Answer[0].data')
          IP_CATALOG=$(curl -s "https://cloudflare-dns.com/dns-query?name=catalog.dazn.com&type=A" -H "accept: application/dns-json" | jq -r '.Answer[0].data')
          echo "playback.dazn.com -> $IP_PLAYBACK"
          echo "catalog.dazn.com -> $IP_CATALOG"
          # Scrivi in /etc/hosts (serve sudo)
          sudo bash -c "echo '$IP_PLAYBACK playback.dazn.com' >> /etc/hosts"
          sudo bash -c "echo '$IP_CATALOG catalog.dazn.com' >> /etc/hosts"
          cat /etc/hosts  # debug

      - name: Download script from Gist
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          curl -s "https://gist.githubusercontent.com/raw/${GIST_ID}/dazn.py" -o dazn.py

      - name: Run DAZN Script
        env:
          DAZN_USER: ${{ secrets.DAZN_USER }}
          DAZN_PASS: ${{ secrets.DAZN_PASS }}
          WVD_BASE64: ${{ secrets.WVD_BASE64 }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python dazn.py

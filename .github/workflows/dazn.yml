name: DAZN M3U Auto Generator

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pywidevine bs4 pyjwt colorama curl_cffi requests lxml PySocks

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          echo "✅ Tailscale installato."

      # ============================================================
      # PASSO 1: Autentica Tailscale SENZA exit node
      # ============================================================
      - name: Authenticate Tailscale
        id: auth
        run: |
          echo "=== Autenticazione Tailscale ==="
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTHKEY }}
          echo "✅ Tailscale autenticato."

      # ============================================================
      # PASSO 2: Verifica se il PC è raggiungibile (tailscale status)
      # ============================================================
      - name: Check if exit node is reachable
        id: reachability_check
        run: |
          echo "=== Verifica raggiungibilità PC ==="
          if tailscale status | grep -q "${{ secrets.TAILSCALE_EXIT_NODE_IP }}"; then
            echo "✅ PC raggiungibile via Tailscale."
            echo "reachable=true" >> $GITHUB_OUTPUT
          else
            echo "❌ PC non raggiungibile (spento o offline). Termino."
            echo "reachable=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      # ============================================================
      # PASSO 3: Se il PC è raggiungibile, connettiti all'exit node
      # ============================================================
      - name: Connect to exit node
        id: tailscale_connect
        if: steps.reachability_check.outputs.reachable == 'true'
        run: |
          echo "=== Connessione all'exit node ==="
          sudo tailscale up \
            --authkey=${{ secrets.TAILSCALE_AUTHKEY }} \
            --exit-node=${{ secrets.TAILSCALE_EXIT_NODE_IP }} \
            --exit-node-allow-lan-access
          echo "✅ Connessione all'exit node completata."
          echo "connected=true" >> $GITHUB_OUTPUT

      # ============================================================
      # VERIFICA FINALE (opzionale)
      # ============================================================
      - name: Verify Tailscale status
        if: steps.tailscale_connect.outputs.connected == 'true'
        run: |
          echo "=== Stato Tailscale ==="
          tailscale status

      # ============================================================
      # VERIFICA STATO WARP
      # ============================================================
      - name: Check Warp status
        id: check_warp
        if: steps.tailscale_connect.outputs.connected == 'true'
        run: |
          echo "=== Verifica stato Warp ==="
          WARP_STATUS=$(curl -s --max-time 10 https://www.cloudflare.com/cdn-cgi/trace | grep -i "^warp=" | cut -d'=' -f2 | tr -d '[:space:]')
          if [ "$WARP_STATUS" == "on" ]; then
            echo "✅ Warp attivo."
            echo "warp_active=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Warp non attivo."
            echo "warp_active=false" >> $GITHUB_OUTPUT
          fi

      # ============================================================
      # DOWNLOAD DEI FILE DAL GIST
      # ============================================================
      - name: Download accountsdazn.json from Gist
        if: steps.tailscale_connect.outputs.connected == 'true'
        run: |
          curl -s -o accountsdazn.json "${{ secrets.ACCOUNTS_GIST_URL }}"
          sed -i '1s/^\xEF\xBB\xBF//' accountsdazn.json
          sed -i 's/\r$//' accountsdazn.json

      - name: Download scripts from Gist
        if: steps.tailscale_connect.outputs.connected == 'true'
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          curl -s "https://gist.githubusercontent.com/raw/${GIST_ID}/dazn.py" -o dazn.py
          curl -s "https://gist.githubusercontent.com/raw/${GIST_ID}/dazn_events.py" -o dazn_events.py

      # ============================================================
      # 1. SCRIPT DAZN 1
      # ============================================================
      - name: Run DAZN 1 Script
        if: steps.tailscale_connect.outputs.connected == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          DUPLICATE_DAZN1_AS_WARP: ${{ steps.check_warp.outputs.warp_active }}
        run: |
          echo "=== Esecuzione DAZN 1 ==="
          python -u dazn.py

      # ============================================================
      # 2. SCRIPT EVENTI
      # ============================================================
      - name: Run DAZN Events Script
        if: steps.tailscale_connect.outputs.connected == 'true' && steps.check_warp.outputs.warp_active == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          echo "=== Esecuzione DAZN Events (Warp attivo) ==="
          python -u dazn_events.py

name: Run Feed Processor

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-processor:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt

    - name: Enable KVM group perms
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Run Emulator and Decrypt
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 33
        target: google_apis
        arch: x86_64
        ram-size: 2048M
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        script: |
          # Sblocca lo schermo dell'emulatore
          adb shell wm dismiss-keyguard

          # Installa l'APK ufficiale SportzX v3.2 (rinominato dudetv_3.2v.apk) con tutti i permessi
          adb install -g dudetv_3.2v.apk

          # Concedi esplicitamente POST_NOTIFICATIONS (Android 13+)
          adb shell pm grant com.sportzx.live android.permission.POST_NOTIFICATIONS || true

          # Esegui lo script di decifratura e scraping (gestisce anche il download di frida-server)
          python fetch_and_decrypt.py

    - name: Commit and Push Decrypted Files
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -f public_decrypted/ config.json
        git commit -m "chore: update decrypted data feeds [skip ci]" || exit 0
        git push

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV DASHBOARD TOTAL FIX</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/controls.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: 'Inter', sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        #header { width: 100%; max-width: 1000px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #30363d; padding-bottom: 15px; }
        .player-container { width: 100%; max-width: 820px; background: #000; margin-bottom: 40px; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        video { width: 100%; aspect-ratio: 16/9; display: block; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 20px; width: 100%; max-width: 1000px; }
        .channel-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; cursor: pointer; transition: 0.2s; overflow: hidden; text-align: center; }
        .channel-card:hover { transform: translateY(-5px); border-color: #58a6ff; }
        .logo-box { height: 90px; display: flex; justify-content: center; align-items: center; padding: 10px; }
        .logo-box img { max-width: 100%; max-height: 100%; }
        .info-box { padding: 10px; border-top: 1px solid #30363d; font-size: 13px; font-weight: 600; }
    </style>
</head>
<body>

    <div id="header">
        <h1 style="color:#58a6ff; margin:0; font-size:22px;">TV DASHBOARD</h1>
        <div id="chan-count" style="font-size:13px; background:#21262d; padding:5px 15px; border-radius:20px;">CARICAMENTO...</div>
    </div>

    <div class="player-container" data-shaka-player-container>
        <video autoplay data-shaka-player id="video"></video>
    </div>

    <div id="main-list" class="grid"></div>

<script>
// --- INSERISCI LA TUA LISTA QUI SOTTO TRA I DUE BACKTICK ( ` ) ---
const M3U_DATA = `
#EXTM3U
#EXTINF:-1 tvg-logo="https://via.placeholder.com/150x80?text=CANALE+1",CANALE ESEMPIO
http://esempio.com/stream.mpd
`;
// ----------------------------------------------------------------

async function init() {
    const video = document.getElementById('video');
    const ui = video['ui'];
    const player = ui.getControls().getPlayer();
    const mainList = document.getElementById('main-list');
    
    player.configure({ streaming: { jumpLargeGaps: true } });

    const lines = M3U_DATA.split('\n');
    let current = { drm: {} };
    let count = 0;

    for (let line of lines) {
        line = line.trim();
        if (line.includes('license_key=')) {
            const val = line.split('=')[1];
            if (val.startsWith('{')) current.drm = JSON.parse(val);
            else {
                const p = val.split(':');
                if (p.length >= 2) current.drm[p[0]] = p[1];
            }
        } else if (line.startsWith('#EXTINF:')) {
            current.logo = (line.match(/tvg-logo="([^"]+)"/i) || [])[1] || "";
            current.name = (line.match(/,(.*)/) || [])[1] || "Canale";
        } else if (line.startsWith('http')) {
            const ch = {...current, url: line};
            const card = document.createElement('div');
            card.className = 'channel-card';
            card.innerHTML = `<div class="logo-box"><img src="${ch.logo}"></div><div class="info-box">${ch.name}</div>`;
            card.onclick = async () => {
                await player.unload();
                player.configure({ drm: { clearKeys: ch.drm } });
                await player.load(ch.url);
                window.scrollTo({top: 0, behavior: 'smooth'});
            };
            mainList.appendChild(card);
            count++;
            current = { drm: {} };
        }
    }
    document.getElementById('chan-count').innerText = count + " CANALI PRONTI";
}
document.addEventListener('shaka-ui-loaded', init);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV DASHBOARD PRO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/controls.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            background-color: #0d1117; 
            color: #c9d1d9; 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            -webkit-font-smoothing: antialiased;
        }
        
        #header { 
            width: 100%; 
            max-width: 1000px;
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 25px; 
            border-bottom: 1px solid #30363d; 
            padding-bottom: 15px; 
        }
        
        h1 { font-size: 22px; font-weight: 700; color: #58a6ff; margin: 0; letter-spacing: -0.5px; }
        #chan-count { font-size: 13px; color: #8b949e; font-weight: 600; background: #21262d; padding: 4px 12px; border-radius: 20px; }
        
        .player-container { 
            width: 100%; 
            max-width: 820px; 
            background: #000; 
            margin-bottom: 40px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        video { width: 100%; aspect-ratio: 16/9; display: block; }

        .category-container { width: 100%; max-width: 1000px; margin-bottom: 45px; }
        .category-title { 
            font-size: 16px; 
            color: #f1e05a; 
            margin-bottom: 20px; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 1px;
            display: flex;
            align-items: center;
        }
        .category-title::before {
            content: "";
            display: inline-block;
            width: 4px;
            height: 18px;
            background: #58a6ff;
            margin-right: 12px;
            border-radius: 2px;
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
            gap: 20px; 
            width: 100%;
        }
        
        .channel-card { 
            background-color: #161b22; 
            border: 1px solid #30363d; 
            border-radius: 12px; 
            cursor: pointer; 
            transition: all 0.25s ease; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
        }
        .channel-card:hover { 
            transform: translateY(-5px); 
            border-color: #58a6ff; 
            background-color: #1c2128;
        }
        .channel-card.active { border-color: #58a6ff; box-shadow: 0 0 15px rgba(88, 166, 255, 0.3); }
        
        .logo-box { 
            width: 100%; 
            height: 100px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: #0d1117; 
            padding: 15px; 
            box-sizing: border-box; 
        }
        .logo-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        .info-box { 
            padding: 12px; 
            text-align: center; 
            border-top: 1px solid #30363d; 
            background: #161b22; 
            flex-grow: 1; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .name { font-size: 13.5px; font-weight: 600; color: #f0f6fc; text-transform: uppercase; }

        @media (max-width: 600px) {
            .grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
            .logo-box { height: 80px; }
        }
    </style>
</head>
<body id="mainBody" style="display:none;">

    <div id="header">
        <h1>DASHBOARD TV</h1>
        <div id="chan-count">CARICAMENTO...</div>
    </div>

    <div class="player-container" data-shaka-player-container>
        <video autoplay data-shaka-player id="video"></video>
    </div>

    <div id="main-list" style="width: 100%;"></div>

<script type="module">
let heartbeatInterval;

function startHeartbeat(password) {
    if (heartbeatInterval) clearInterval(heartbeatInterval);
    heartbeatInterval = setInterval(async () => {
        try {
            await fetch("/api/get-list", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-heartbeat': 'true' },
                body: JSON.stringify({ password: password })
            });
        } catch (e) { console.warn("Heartbeat failed"); }
    }, 20000); 
}

const CANALI_FISSI = [
    { name: "EUROSPORT 4K", logo: "https://thumb.prod.front.tim.cptech.pro/http/unsafe/120x90/img-cdn.prod.catalog.tim.cptech.pro/p1/channel/90020019/tim-ouah/CHN43FN/MONOGRAM_ESP4K_WHITE_V2-BjK0", url: "https://timlivetu0.cb.ticdn.it/Content/DASH/Live/channel(eurosport4k)/manifest.mpd", drm: {"9ceae06c6ad34aada83ba86c0b511452":"406862beb4af1ef8fe04ba15d9936360","fcd924bd2e45470fa2ae50ef05e357c0":"266db84d3572bc889185274a90ff31df","dea135e33341468f8a4e8da806d8a6e6":"fb7423db39e6fab75056f8c83f415847","31911db90ee3410f8b38e45659d01fb1":"ac316ab7dfd2b50faf6d44633e4fedd5","a16f2a39adbb4974b8910cec8a651a09":"c2d55e0111af955f47214af209a2c468"} },
    { name: "EUROSPORT 1", logo: "https://thumb.prod.front.tim.cptech.pro/http/unsafe/120x90/img-cdn.prod.catalog.tim.cptech.pro/p1/channel/90020000/tim-ouah/CHN43FN/MONOGRAM_ESP1_WHITE_V2-Lv2g", url: "https://timlivetu0.cb.ticdn.it/Content/DASH/Live/channel(eurosport1)/manifest.mpd", drm: {"46e559c2f9f645ce8d80c7fa20446bdb":"597d214d66342ee042bccffeb165e750"} },
    { name: "EUROSPORT 2", logo: "https://thumb.prod.front.tim.cptech.pro/http/unsafe/120x90/img-cdn.prod.catalog.tim.cptech.pro/p1/channel/90020001/tim-ouah/CHN43FN/MONOGRAM_ESP2_WHITE_V2-Zp7E", url: "https://timlivetu0.cb.ticdn.it/Content/DASH/Live/channel(eurosport2)/manifest.mpd", drm: {"e8372283a523444c84646c4172b1bc0f":"969a90e1a1a6424a68fe4b5d776368ec"} }
];

async function checkAccess() {
    const psw = prompt("Inserisci Password:");
    if (!psw) return;

    try {
        const response = await fetch("/api/get-list", {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: psw })
        });

        if (!response.ok) {
            alert("Password errata o sessione occupata!");
            window.location.reload();
            return;
        }

        const m3uData = await response.text();
        document.getElementById('mainBody').style.display = "flex";
        startHeartbeat(psw);
        render(m3uData, psw);

    } catch (error) { alert("Errore connessione server."); }
}

function render(m3uContent, userPsw) {
    const video = document.getElementById('video');
    const ui = video['ui'];
    const player = ui.getControls().getPlayer();
    const mainList = document.getElementById('main-list');
    const chanCount = document.getElementById('chan-count');

    player.configure({ streaming: { jumpLargeGaps: true } });

    function addCard(ch) {
        const group = (ch.group || "LISTA").toUpperCase();
        let gridId = `grid-${group.replace(/\s+/g, '-')}`;
        let grid = document.getElementById(gridId);

        if (!grid) {
            const container = document.createElement('div');
            container.className = 'category-container';
            container.innerHTML = `<div class="category-title">${group}</div><div class="grid" id="${gridId}"></div>`;
            mainList.appendChild(container);
            grid = document.getElementById(gridId);
        }

        const card = document.createElement('div');
        card.className = 'channel-card';
        card.innerHTML = `
            <div class="logo-box"><img src="${ch.logo}" onerror="this.src='https://via.placeholder.com/150x80?text=LOGO'"></div>
            <div class="info-box"><div class="name">${ch.name}</div></div>
        `;
        card.onclick = async () => {
            document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
            card.classList.add('active');
            await player.unload();
            player.configure({ drm: { clearKeys: ch.drm } });
            await player.load(ch.url);
            window.scrollTo({top: 0, behavior: 'smooth'});
        };
        grid.appendChild(card);
    }

    const lines = m3uContent.split('\n');
    let current = { drm: {}, group: "LISTA" };
    let count = 0;

    for (let line of lines) {
        line = line.trim();
        if (line.includes('license_key=')) {
            const val = line.split('=')[1];
            if (val.startsWith('{')) current.drm = JSON.parse(val);
            else {
                const p = val.split(':');
                if (p.length === 2) current.drm[p[0]] = p[1];
            }
        } else if (line.startsWith('#EXTINF:')) {
            current.logo = (line.match(/tvg-logo="([^"]+)"/i) || [])[1] || "";
            current.group = (line.match(/group-title="([^"]+)"/i) || [])[1] || "LISTA";
            current.name = (line.match(/,(.*)/) || [])[1] || "Canale";
        } else if (line.startsWith('http')) {
            current.url = line;
            if (userPsw === "Matteo") {
                if (current.name.toUpperCase().includes("F1")) { addCard({...current}); count++; }
            } else { addCard({...current}); count++; }
            current = { drm: {}, group: "LISTA" };
        }
    }

    if (userPsw !== "Matteo") {
        CANALI_FISSI.forEach(ch => { addCard({...ch, group: "EUROSPORT"}); count++; });
    }
    chanCount.innerText = count + " CANALI";
}

document.addEventListener('shaka-ui-loaded', checkAccess);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>TV DASHBOARD API MODE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/controls.min.css">
    <style>
        body { background: #0d1117; color: #fff; font-family: sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .player-container { width: 100%; max-width: 800px; background: #000; margin-bottom: 30px; }
        video { width: 100%; aspect-ratio: 16/9; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; width: 100%; max-width: 1000px; }
        .card { background: #161b22; border: 1px solid #30363d; padding: 10px; border-radius: 8px; cursor: pointer; text-align: center; }
        .card img { max-width: 100%; height: 60px; object-fit: contain; }
    </style>
</head>
<body>

    <h1 id="status">CARICAMENTO API...</h1>

    <div class="player-container" data-shaka-player-container>
        <video autoplay data-shaka-player id="video"></video>
    </div>

    <div id="main-list" class="grid"></div>

<script>
async function init() {
    const video = document.getElementById('video');
    const player = video['ui'].getControls().getPlayer();
    const mainList = document.getElementById('main-list');

    try {
        // CHIAMATA ALLA TUA API VERCEL
        const res = await fetch("/api/get-list");
        if (!res.ok) throw new Error("API Error");
        const text = await res.text();

        const lines = text.split('\n');
        let current = { drm: {} };
        let count = 0;

        for (let line of lines) {
            line = line.trim();
            if (line.includes('license_key=')) {
                const val = line.split('=')[1];
                if (val.startsWith('{')) current.drm = JSON.parse(val);
                else {
                    const p = val.split(':');
                    if (p.length >= 2) current.drm[p[0]] = p[1];
                }
            } else if (line.startsWith('#EXTINF:')) {
                current.logo = (line.match(/tvg-logo="([^"]+)"/i) || [])[1] || "";
                current.name = (line.match(/,(.*)/) || [])[1] || "Canale";
            } else if (line.startsWith('http')) {
                const ch = {...current, url: line};
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<img src="${ch.logo}"><p>${ch.name}</p>`;
                card.onclick = async () => {
                    await player.unload();
                    player.configure({ drm: { clearKeys: ch.drm } });
                    await player.load(ch.url);
                };
                mainList.appendChild(card);
                count++;
                current = { drm: {} };
            }
        }
        document.getElementById('status').innerText = count + " CANALI (API)";
    } catch (e) {
        document.getElementById('status').innerText = "ERRORE API";
    }
}
document.addEventListener('shaka-ui-loaded', init);
</script>
</body>
</html>

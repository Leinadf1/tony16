<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>TV DASHBOARD PRO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.11.11/controls.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            background-color: #0d1117; 
            color: #c9d1d9; 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            -webkit-font-smoothing: antialiased;
        }
        
        #header { 
            width: 100%; 
            max-width: 1000px;
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 25px; 
            border-bottom: 1px solid #30363d; 
            padding-bottom: 15px; 
            box-sizing: border-box; 
        }
        
        h1 { font-size: 22px; font-weight: 700; color: #58a6ff; margin: 0; }
        #chan-count { font-size: 13px; color: #8b949e; background: #21262d; padding: 4px 12px; border-radius: 20px; }
        
        /* IL PEZZO CHE VOLEVI: Player adattivo */
        .player-container { 
            width: 100%; 
            max-width: 820px; 
            background: #000; 
            margin-bottom: 40px; 
            z-index: 1000; /* Assicura che stia sopra la lista */
        }
        video { width: 100%; aspect-ratio: 16/9; display: block; }

        .category-container { width: 100%; max-width: 1000px; margin-bottom: 45px; }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
            gap: 20px; 
        }
        
        .channel-card { 
            background-color: #161b22; border: 1px solid #30363d; border-radius: 12px; 
            cursor: pointer; transition: all 0.2s; overflow: hidden; 
        }
        .channel-card:hover { border-color: #58a6ff; transform: translateY(-3px); }
        .channel-card.active { border: 2px solid #58a6ff; }
        
        .logo-box { height: 100px; display: flex; justify-content: center; align-items: center; padding: 15px; }
        .logo-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .info-box { padding: 12px; text-align: center; border-top: 1px solid #30363d; background: #161b22; }
        .name { font-size: 13px; font-weight: 600; text-transform: uppercase; }

        /* LOGICA MOBILE DALL'ALTRO PROGETTO */
        @media (max-width: 600px) {
            body { padding: 0; }
            #header { padding: 15px; margin-bottom: 0; border: none; }
            .player-container { 
                position: sticky; 
                top: 0; 
                margin-bottom: 20px; 
            }
            .grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; padding: 0 10px; }
            .category-title { padding-left: 15px; font-size: 14px; color: #f1e05a; margin-bottom: 15px; font-weight: 700; }
            .logo-box { height: 80px; }
        }
    </style>
</head>
<body>

    <div id="header">
        <h1>DASHBOARD TV</h1>
        <div id="chan-count">0 CANALI</div>
    </div>

    <div class="player-container" data-shaka-player-container>
        <video autoplay data-shaka-player id="video"></video>
    </div>

    <div id="main-list" style="width: 100%;"></div>

<script>
const SOURCE = "lista.m3u"; // Qui metti il tuo file o /api/get-list

async function init() {
    const video = document.getElementById('video');
    const ui = video['ui'];
    const player = ui.getControls().getPlayer();
    const mainList = document.getElementById('main-list');

    player.configure({ streaming: { jumpLargeGaps: true } });

    try {
        const res = await fetch(SOURCE);
        const text = await res.text();
        const lines = text.split('\n');
        let ch = { drm: {} };
        let count = 0;

        for (let line of lines) {
            line = line.trim();
            if (line.includes('license_key=')) {
                const val = line.split('=')[1];
                if (val.startsWith('{')) ch.drm = JSON.parse(val);
                else {
                    const parts = val.split(':');
                    if (parts.length === 2) ch.drm[parts[0]] = parts[1];
                }
            } else if (line.startsWith('#EXTINF:')) {
                ch.logo = (line.match(/tvg-logo="([^"]+)"/i) || [])[1] || "";
                ch.group = (line.match(/group-title="([^"]+)"/i) || [])[1] || "LISTA";
                ch.name = (line.match(/,(.*)/) || [])[1] || "Canale";
            } else if (line.startsWith('http')) {
                const currentCh = {...ch, url: line};
                count++;

                let gridId = `grid-${currentCh.group.replace(/\s+/g, '-').toLowerCase()}`;
                let grid = document.getElementById(gridId);
                
                if (!grid) {
                    const container = document.createElement('div');
                    container.className = 'category-container';
                    container.innerHTML = `<div class="category-title">${currentCh.group.toUpperCase()}</div><div class="grid" id="${gridId}"></div>`;
                    mainList.appendChild(container);
                    grid = document.getElementById(gridId);
                }

                const card = document.createElement('div');
                card.className = 'channel-card';
                card.innerHTML = `<div class="logo-box"><img src="${currentCh.logo}"></div><div class="info-box"><div class="name">${currentCh.name}</div></div>`;
                
                card.onclick = async () => {
                    document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
                    card.classList.add('active');
                    await player.unload();
                    player.configure({ drm: { clearKeys: currentCh.drm } });
                    await player.load(currentCh.url);
                    if (window.innerWidth > 600) window.scrollTo({top: 0, behavior: 'smooth'});
                };
                grid.appendChild(card);
                ch = { drm: {} };
            }
        }
        document.getElementById('chan-count').innerText = count + " CANALI";
    } catch(e) { console.error(e); }
}

document.addEventListener('shaka-ui-loaded', init);
</script>
</body>
</html>
